name: Deploy

# Runs only after CI finishes on main, and only if it passed — a broken
# push should never auto-deploy to a live tool students are using during
# actual discussion sections.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: cd /opt/cs61a-discussion && bash deploy/scripts/deploy.sh
