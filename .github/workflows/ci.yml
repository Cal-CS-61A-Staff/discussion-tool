name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r server/requirements.txt pytest

      - name: Run backend tests
        run: python -m pytest server/tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Build frontend
        working-directory: client
        run: npm run build

      # The in-browser grading harness (client/src/pyodide/harness.py) —
      # loads it under Pyodide in node and checks doctest/pltest/run_call
      # against fixtures. Replaces the old server-side test_grading.py.
      - name: Verify grading harness
        working-directory: client
        run: npm run verify-harness
